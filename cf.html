<!-- cf.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cloudflare Detection Report</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f4f4f4; }
    h1 { font-size: 24px; }
    .combo { background: #fff; padding: 1rem; margin-bottom: 1rem; border-left: 5px solid #0073e6; }
    .logic { font-size: 14px; color: #555; margin-top: 0.5rem; }
    code { background: #eee; padding: 2px 4px; border-radius: 4px; }
    .result { margin: 0.3rem 0; }

    /* [BACK TO MENU] fixed top-right button */
    .back-button {
      position: fixed;
      top: 1.5rem;
      right: 2rem;
      padding: 0.6rem 1.2rem;
      background: #555;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      cursor: pointer;
      z-index: 10;
    }
    .back-button:hover { background: #444; }
  </style>
</head>
<body>
  <!-- [BACK TO MENU] -->
  <button class="back-button" onclick="location.href='/'">Back to Main Menu</button>

  <h1>Cloudflare Detection Report</h1>
  <div id="results-container">Loading...</div>

  <script>
    async function fetchDetectionData() {
      try {
        const res = await fetch('/js-detection');
        if (!res.ok) throw new Error('js-detection fetch failed');
        const data = await res.json();

        const navigatorValue = sessionStorage.getItem('navigator.webdriver');
        data["navigator.webdriver"] = navigatorValue;

        console.log('Final merged data:', data);
        renderDetectionCombos(data);
      } catch (err) {
        console.error('Detection error:', err);
        document.getElementById('results-container').innerText =
          'Failed to fetch detection data: ' + err.message;
      }
    }

    // [ESCAPE] header values (User-Agent, Referer, Cookie…) are visitor-controlled: escape before inserting as HTML
    const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function renderDetectionCombos(data) {
      const container = document.getElementById('results-container');
      container.innerHTML = '';

      function field(key) {
        const v = data[key];
        const shown = v == null ? 'N/A' : (typeof v === 'object' ? JSON.stringify(v) : v);
        return `<div class="result"><strong>${key}:</strong> <code>${esc(shown)}</code></div>`;
      }

      function combo(title, logic, keys) {
        return `
          <div class="combo">
            <h2>${title}</h2>
            ${keys.map(field).join('')}
            <div class="logic"><strong>Why it works:</strong> ${logic}</div>
          </div>
        `;
      }

      container.innerHTML = [
        combo("1. Low-Trust Headless Automation",
          "Headless UAs with automation typically fail JS challenges and get low bot scores.",
          ["userAgent", "secChUa", "navigator.webdriver", "botScore", "wafScore", "jsDpassed"]),

        combo("2. Cloud Infrastructure Bots",
          "Legit browsers from cloud ASNs are rare and often coupled with scraping or exploit payloads.",
          ["asn", "userAgent", "botScore", "wafScore", "wafSQLi", "wafXSS", "wafRCE", "secChUaPlatform"]),

        combo("3. Spoofed Browsers with Bad TLS",
          "TLS fingerprints and versions must match claimed UA. Spoofing often overlaps with injection attempts.",
          ["userAgent", "ja3", "ja4", "secChUaPlatform", "wafScore", "wafSQLi", "wafXSS"]),

        combo("4. Language & Region Mismatch",
          "Language and IP geo should correlate. Disparity = proxy or misconfigured bot.",
          ["country", "acceptLanguage", "userAgent", "wafScore"]),

        combo("5. Bypassed Browser Validation",
          "Legit browsers send a full set of client hints and cookies. Bots often skip these.",
          ["cookie", "secChUa", "secFetchSite", "secChUaMobile", "botScore", "jsDpassed"]),

        combo("6. Suspicious Referer Chain",
          "Bots often lack proper referer/Origin chains or spoof them sloppily. XSS vectors sometimes abuse referrer headers.",
          ["referer", "origin", "secFetchSite", "wafScore", "ja3", "wafXSS"]),

        combo("7. Verified Bot Impersonators",
          "Cloudflare validates real Googlebot IPs. Mismatch of UA + ASN = fake bot.",
          ["userAgent", "asn", "verifiedBot", "botScore", "botDetectionId"])
      ].join('');
    }

    // Add JS-based detection
    window.addEventListener('load', () => {
      sessionStorage.setItem('navigator.webdriver', navigator.webdriver ? 'true' : 'false');
      fetchDetectionData();
    });
  </script>
</body>
</html>
