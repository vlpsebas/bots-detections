<!-- cf.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cloudflare Detection Report</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f4f4f4; }
    h1 { font-size: 24px; }
    .combo { background: #fff; padding: 1rem; margin-bottom: 1rem; border-left: 5px solid #0073e6; }
    .logic { font-size: 14px; color: #555; margin-top: 0.5rem; }
    code { background: #eee; padding: 2px 4px; border-radius: 4px; }
    .result { margin: 0.3rem 0; }
  </style>
</head>
<body>
  <h1>Cloudflare Detection Report</h1>
  <div id="results-container">Loading...</div>

  <script>
  async function fetchDetectionData() {
    try {
      const [workerRes, jsRes] = await Promise.all([
        fetch('/worker-detection'),
        fetch('/js-detection')
      ]);

      if (!workerRes.ok || !jsRes.ok) throw new Error('Fetch failed');

      const [workerData, jsData] = await Promise.all([
        workerRes.json(),
        jsRes.json()
      ]);

      const data = { ...jsData, ...workerData };

      renderDetectionCombos(data);

      // Inject navigator.webdriver into the final output
      const injected = sessionStorage.getItem('navigator.webdriver');
      const codeElements = document.querySelectorAll("code");
      codeElements.forEach(el => {
        if (el.textContent.includes('navigator.webdriver')) {
          el.textContent = injected;
        }
      });

    } catch (err) {
      document.getElementById('results-container').innerText =
        'Failed to fetch detection data from worker/js-detection: ' + err.message;
    }
  }

  window.addEventListener('load', () => {
    sessionStorage.setItem('navigator.webdriver', navigator.webdriver ? 'true' : 'false');
    fetchDetectionData();
  })
    
      function renderDetectionCombos(data) {
        const container = document.getElementById('results-container');
          container.innerHTML = '';

      function field(key) {
        return `<div class="result"><strong>${key}:</strong> <code>${data[key] ?? 'N/A'}</code></div>`;
      }

      function combo(title, logic, keys) {
        return `
          <div class="combo">
            <h2>${title}</h2>
            ${keys.map(field).join('')}
            <div class="logic"><strong>Why it works:</strong> ${logic}</div>
          </div>
        `;
      }

      container.innerHTML = [
        combo("1. Low-Trust Headless Automation",
          "Headless UAs with automation typically fail JS challenges and get low bot scores.",
          ["userAgent", "sec-ch-ua", "navigator.webdriver", "botScore", "wafAction"]),

        combo("2. Cloud Infrastructure Bots",
          "Legit browsers from cloud ASNs are rare and often coupled with scraping behavior.",
          ["asn", "userAgent", "botScore", "wafScore", "sec-ch-ua-platform"]),

        combo("3. Spoofed Browsers with Bad TLS",
          "TLS fingerprints and versions must match claimed UA. Spoofing usually mismatches.",
          ["userAgent", "ja3", "ja4", "sec-ch-ua-platform", "wafScore"]),

        combo("4. Language & Region Mismatch",
          "Language and IP geo should correlate. Disparity = proxy or misconfigured bot.",
          ["cfCountry", "accept-language", "userAgent", "wafScore"]),

        combo("5. Bypassed Browser Validation",
          "Legit browsers send a full set of client hints and cookies. Bots often skip these.",
          ["cookie", "sec-ch-ua", "sec-fetch-site", "sec-ch-mobile", "botScore"]),

        combo("6. Suspicious Referer Chain",
          "Bots often lack proper referer/Origin chains or spoof them sloppily.",
          ["referer", "origin", "sec-fetch-site", "wafAction", "ja3"]),

        combo("7. Verified Bot Impersonators",
          "Cloudflare validates real Googlebot IPs. Mismatch of UA + ASN = fake bot.",
          ["userAgent", "asn", "verifiedBot", "botScore"])
      ].join('');
    }

    // Add JS-based detection
    window.addEventListener('load', () => {
      navigator.webdriver
        ? sessionStorage.setItem('navigator.webdriver', 'true')
        : sessionStorage.setItem('navigator.webdriver', 'false');

      fetchDetectionData().then(() => {
        const injected = sessionStorage.getItem('navigator.webdriver');
        const el = document.querySelector("code:contains('navigator.webdriver')");
        if (el) el.textContent = injected;
      });
    });
  </script>
</body>
</html>

    fetchDetectionData();
  </script>
</body>
</html>
