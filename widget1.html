<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Widget 1</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px;
      background-color: #f9f9f9;
    }

    h1 {
      margin-bottom: 40px;
    }

    .rounded-button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 20px;
    }

    .rounded-button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>Widget 1</h1>

  <div class="cf-turnstile"
       data-sitekey="0x4AAAAAAA4xZwlByN75XeEv"
       data-callback="onTurnstileSuccess"></div>

  <button class="rounded-button" onclick="window.location.href='jsd.html'">Back to Home</button>

  <script>
    async function onTurnstileSuccess(token) {
      try {
        const res = await fetch('/api/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, widget: 'widget1' })
        });
        const data = await res.json();
        console.log('Turnstile result:', data);
        alert(`Widget 1 verified: ${data.success}`);
      } catch (err) {
        console.error('Error logging Turnstile:', err);
      }
    }
  </script>
</body>
</html>
