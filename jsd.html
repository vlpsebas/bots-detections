<!-- jsd.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Turnstile Widgets</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
 
    h1 {
      margin-bottom: 2rem;
    }
 
    .button-container {
      display: flex;
      gap: 1.5rem;
    }
 
    .rounded-button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 12px;
      background-color: #ddd; /* Change color as needed */
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
    }
 
    .rounded-button:hover {
      background-color: #ccc;
    }
  </style>
</head>
<body>
  <h1>Turnstile Demo</h1>
  <p>Select a widget page:</p>
    <div class="button-container">
      <a href="/widget1.html"><button class="rounded-button">Widget 1</button></a>
      <a href="/widget2.html"><button class="rounded-button">Widget 2</button></a>
      <a href="/widget3.html"><button class="rounded-button">Widget 3</button></a>
      <a href="/widget4.html"><button class="rounded-button">Widget 4</button></a>
    </div>
</body>
</html>
